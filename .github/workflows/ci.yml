name: CI & DSP Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone JUCE Framework
      run: |
        git clone --depth 1 https://github.com/juce-framework/JUCE.git ../../juce_environment/JUCE

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r qa_suite/requirements.txt
        cd qa_suite
        pip install .

    - name: Configure CMake
      run: cmake -B build -A x64

    - name: Build Standalone & VST3
      run: cmake --build build --config Release --parallel 4

    - name: Run Pytest Suite
      run: |
        cd qa_suite
        python -m pytest